methods:
- name: 5w1h-analysis
  title: 5W1H Analysis
  category: problem-framing-and-evidence
  use_when: Use when a situation, request, problem, event, stakeholder issue, process, or plan needs basic
    fact clarification through who, what, when, where, why, and how. Use when applying 5W1H, 4W1H, fact
    clarification, situation framing, or first-pass problem understanding.
  do_not_use_when: Do not use as evidence grading, root-cause proof, or strategic diagnosis. Use `evidence-map`
    when source quality and confidence matter; use `five-whys-root-cause` only after the observed problem
    is clear. Stop after the basic situation frame is complete.
  required_inputs:
  - raw situation description
  - known stakeholders or actors
  - event, problem, decision, or plan
  - timing and location or context
  - current explanation or desired outcome
  primary_outputs:
  - Who map
  - What statement
  - Timing view
  - Context boundary
  - Why view
  - How view
  - Clarification questions
  adjacent_methods:
  - evidence-map
  - five-whys-root-cause
  version: 0.3.0
  source: skills/5w1h-analysis/SKILL.md
- name: abductive-reasoning
  title: Abductive Reasoning
  category: reasoning-and-root-cause
  use_when: Use when the best explanation must be inferred from incomplete, ambiguous, or competing evidence.
    Use when applying abductive reasoning, inference to the best explanation, mystery diagnosis, competing
    explanation review, or plausible hypothesis selection.
  do_not_use_when: Do not use when a formal rule already determines the conclusion. Use `deductive-reasoning`
    instead. Do not use when the task is broad pattern discovery; use `inductive-reasoning` first.
  required_inputs:
  - surprising fact, event, behavior, or outcome
  - known evidence
  - candidate explanations
  - missing evidence
  - decision consequence if the explanation is wrong
  primary_outputs:
  - Explanation question
  - Evidence list
  - Explanation candidates
  - Fit table
  - Plausibility ranking
  - Validation tests
  - Working diagnosis
  adjacent_methods:
  - deductive-reasoning
  - inductive-reasoning
  version: 0.3.0
  source: skills/abductive-reasoning/SKILL.md
- name: account-plan
  title: Account Plan
  category: strategy-market-and-commercial
  use_when: Use when pursuing, defending, expanding, or recovering a client account or project opportunity.
    Use when applying the Account Plan consulting method and when a user asks for Account Plan, method
    execution, structured diagnosis, or action planning.
  do_not_use_when: Do not use without a named account, a defined business need, relevant stakeholders,
    a value hypothesis, and a next customer decision. It is not a generic market or campaign plan.
  required_inputs:
  - account background
  - opportunity
  - stakeholders
  - competitors
  - relationship evidence
  primary_outputs:
  - Account objective
  - Account stakeholder map
  - Value/proof diagnosis
  - Account risk/path map
  - 30-day account plan
  adjacent_methods: []
  version: 0.3.0
  source: skills/account-plan/SKILL.md
- name: affinity-diagram
  title: Affinity Diagram
  category: problem-framing-and-evidence
  use_when: Use when many raw ideas, observations, quotes, pain points, risks, requirements, or research
    notes need to be grouped into natural themes. Use when applying affinity diagramming, affinity mapping,
    KJ method, qualitative clustering, theme synthesis, or sensemaking from messy inputs.
  do_not_use_when: Do not use when the categories are already fixed by a required taxonomy, compliance
    rule, financial chart of accounts, or formal decision criteria. Use `mece-framework`, `decision-matrix`,
    or `weighted-scorecard` instead.
  required_inputs:
  - raw items to cluster
  - source or context of each item when available
  - purpose of the clustering
  - audience or decision context
  - any known constraints, such as time, segment, process stage, or stakeholder group
  primary_outputs:
  - Synthesis question
  - Clean item list
  - Draft clusters
  - Cluster names
  - Refined affinity map
  - Theme implications
  - Outlier and gap list
  adjacent_methods:
  - decision-matrix
  - mece-framework
  - weighted-scorecard
  version: 0.3.0
  source: skills/affinity-diagram/SKILL.md
- name: assumption-inventory
  title: Assumption Inventory
  category: problem-framing-and-evidence
  use_when: Use when a recommendation, plan, diagnosis, or stakeholder judgment depends on unstated assumptions
    that must be named and tested. Use when applying assumption inventory, assumption mapping, leap-of-faith
    assumption review, or critical assumption testing.
  do_not_use_when: Do not use when the issue is primarily role ownership, numerical prioritization, or
    root cause analysis. Use `raci-matrix`, `wsjf-prioritization`, or `five-whys-root-cause` instead.
  required_inputs:
  - current diagnosis, plan, or recommendation
  - intended outcome
  - key stakeholders or users
  - known facts and constraints
  - major risks if the plan is wrong
  primary_outputs:
  - Plan / diagnosis statement
  - Assumption list
  - Classified assumptions
  - Critical assumption table
  - Test priority list
  - Assumption test plan
  adjacent_methods:
  - five-whys-root-cause
  - raci-matrix
  - wsjf-prioritization
  version: 0.3.0
  source: skills/assumption-inventory/SKILL.md
- name: balanced-scorecard
  title: Balanced Scorecard
  category: measurement-and-performance
  use_when: Use when performance management needs a broader view than financial or single KPI tracking.
    Use when applying the Balanced Scorecard consulting method and when a user asks for Balanced Scorecard,
    method execution, structured diagnosis, or action planning.
  do_not_use_when: Do not use before the strategy, intended outcomes, and cause-and-effect logic are clear.
    A balanced scorecard is a small management system, not a catalogue of every available KPI.
  required_inputs:
  - strategy or objective
  - current metrics
  - stakeholders
  - time horizon
  primary_outputs:
  - Strategy frame
  - Perspective objectives
  - Scorecard metrics
  - Targets and initiatives
  - Balanced scorecard
  adjacent_methods: []
  version: 0.3.0
  source: skills/balanced-scorecard/SKILL.md
- name: break-even-analysis
  title: Break Even Analysis
  category: prioritization-and-economics
  use_when: Use when a commercial, operational, or investment decision needs a threshold for viability.
    Use when applying the Break Even Analysis consulting method and when a user asks for Break Even Analysis,
    method execution, structured diagnosis, or action planning.
  do_not_use_when: Do not use when fixed costs, variable costs, unit revenue, and the relevant time horizon
    cannot be estimated. Break-even analysis tests an economic threshold; it does not establish overall
    strategic fit.
  required_inputs:
  - fixed costs
  - variable costs
  - price or benefit per unit
  - time horizon
  - constraints
  primary_outputs:
  - Break-even definition
  - Cost structure
  - Unit economics
  - Break-even threshold
  - Viability interpretation
  adjacent_methods: []
  version: 0.3.0
  source: skills/break-even-analysis/SKILL.md
- name: business-model-canvas
  title: Business Model Canvas
  category: strategy-market-and-commercial
  use_when: Use when clarifying how a business, product, offer, or venture creates, delivers, and captures
    value. Use when applying the Business Model Canvas consulting method and when a user asks for Business
    Model Canvas, method execution, structured diagnosis, or action planning.
  do_not_use_when: Do not treat a completed canvas as proof that a business model works. Use it to expose
    connected assumptions about customers, value, operations, revenue, and cost that still need testing.
  required_inputs:
  - business or offer
  - customer segments
  - value proposition
  - operating model
  primary_outputs:
  - Canvas scope
  - Customer/value blocks
  - Delivery/revenue blocks
  - Operating/cost blocks
  - Model risks and test plan
  adjacent_methods: []
  version: 0.3.0
  source: skills/business-model-canvas/SKILL.md
- name: change-event-timeline
  title: Change Event Timeline
  category: stakeholder-change-and-governance
  use_when: Use when the timing of events, turning points, stakeholder behavior changes, or cause-and-effect
    sequence must be clarified. Use when applying a change event timeline, turning-point analysis, event
    sequence map, or before-after signal review.
  do_not_use_when: Do not use when timing is irrelevant or the decision is purely comparative. Use `decision-matrix`
    or `weighted-scorecard` instead.
  required_inputs:
  - situation or decision question
  - key events and dates or approximate sequence
  - before-state and after-state
  - stakeholders involved in each event
  - observed behavior, decision, metric, or risk change
  primary_outputs:
  - Baseline state
  - Event timeline
  - Turning-point candidates
  - Trigger/background classification
  - Timeline-based hypotheses
  - Timeline validation plan
  adjacent_methods:
  - decision-matrix
  - weighted-scorecard
  version: 0.3.0
  source: skills/change-event-timeline/SKILL.md
- name: change-impact-analysis
  title: Change Impact Analysis
  category: stakeholder-change-and-governance
  use_when: Use when implementing process, system, organization, policy, or operating-model changes. Use
    when applying the Change Impact Analysis consulting method and when a user asks for Change Impact
    Analysis, method execution, structured diagnosis, or action planning.
  do_not_use_when: Do not use before the proposed change, affected groups, processes, systems, locations,
    and timing are defined. It identifies what must adapt; it does not replace a delivery plan or risk
    assessment.
  required_inputs:
  - change description
  - affected groups
  - current vs future process
  - adoption constraints
  primary_outputs:
  - Change definition
  - Affected group map
  - Impact assessment
  - Adoption support plan
  - Change rollout plan
  adjacent_methods: []
  version: 0.3.0
  source: skills/change-impact-analysis/SKILL.md
- name: communications-plan
  title: Communications Plan
  category: stakeholder-change-and-governance
  use_when: Use when a decision, change, project, or stakeholder move needs coordinated communication.
    Use when applying the Communications Plan consulting method and when a user asks for Communications
    Plan, method execution, structured diagnosis, or action planning.
  do_not_use_when: Do not use before the audience, required behavior, sender, channel, timing, and feedback
    path are clear. Communication cannot compensate for missing authority, broken process, or misaligned
    incentives.
  required_inputs:
  - communication objective
  - audiences
  - messages
  - channels
  - timing constraints
  primary_outputs:
  - Communication objective
  - Audience segments
  - Audience-message matrix
  - Cadence and feedback plan
  - Ready-to-send communication plan
  adjacent_methods: []
  version: 0.3.0
  source: skills/communications-plan/SKILL.md
- name: competitive-positioning
  title: Competitive Positioning
  category: strategy-market-and-commercial
  use_when: Use when a strategy, offer, pitch, or account plan needs sharper differentiation. Use when
    applying the Competitive Positioning consulting method and when a user asks for Competitive Positioning,
    method execution, structured diagnosis, or action planning.
  do_not_use_when: Do not use without a target segment, relevant alternatives, buying criteria, and evidence
    of why customers choose. Positioning is a defensible choice, not a slogan or feature inventory.
  required_inputs:
  - offering
  - target customer
  - competitors or alternatives
  - proof points
  primary_outputs:
  - Positioning frame
  - Competitive alternative map
  - Positioning comparison
  - Defensible differentiators
  - Positioning package
  adjacent_methods: []
  version: 0.3.0
  source: skills/competitive-positioning/SKILL.md
- name: constraint-analysis
  title: Constraint Analysis
  category: reasoning-and-root-cause
  use_when: Use when progress is limited by bottlenecks, scarce resources, binding constraints, dependencies,
    policy limits, capacity limits, decision rights, or one factor that controls throughput. Use when
    applying constraint analysis, bottleneck diagnosis, theory of constraints, limiting-factor review,
    or constraint removal planning.
  do_not_use_when: Do not use when the issue is mainly unclear preference or option selection. Use `decision-matrix`
    or `weighted-scorecard` instead.
  required_inputs:
  - goal or desired throughput
  - current process, path, or action sequence
  - observed blockage or delay
  - resources, capacity, decision rights, dependencies, and policies
  - evidence of where work queues, stalls, or fails
  primary_outputs:
  - Goal statement
  - Flow map
  - Bottleneck candidates
  - Constraint table
  - Binding constraint
  - Constraint action
  - Next-constraint watchlist
  adjacent_methods:
  - decision-matrix
  - weighted-scorecard
  version: 0.3.0
  source: skills/constraint-analysis/SKILL.md
- name: cost-benefit-analysis
  title: Cost Benefit Analysis
  category: prioritization-and-economics
  use_when: Use when deciding whether an action is worth the resources, attention, or tradeoffs required.
    Use when applying the Cost Benefit Analysis consulting method and when a user asks for Cost Benefit
    Analysis, method execution, structured diagnosis, or action planning.
  do_not_use_when: Do not use when material costs and benefits cannot be compared over a common time horizon.
    Treat non-negotiable legal, safety, or policy constraints as gates rather than averaging them into
    a financial total.
  required_inputs:
  - option or investment
  - benefit estimates
  - cost estimates
  - time horizon
  - risk assumptions
  primary_outputs:
  - Baseline and option definition
  - Benefit estimate table
  - Cost estimate table
  - Scenario comparison
  - Cost-benefit recommendation
  adjacent_methods: []
  version: 0.3.0
  source: skills/cost-benefit-analysis/SKILL.md
- name: critical-uncertainties
  title: Critical Uncertainties
  category: systems-risk-and-futures
  use_when: Use when a decision depends on a few uncertain variables whose direction could materially
    change the plan. Use when applying critical uncertainties, uncertainty mapping, scenario driver selection,
    strategic uncertainty review, or signpost planning.
  do_not_use_when: Do not use for ordinary risks with known mitigation paths. Use `risk-matrix` or `pre-mortem`
    instead.
  required_inputs:
  - decision question or strategic choice
  - possible uncertainties
  - decision time horizon
  - consequences of different outcomes
  - early indicators or data sources when available
  primary_outputs:
  - Decision horizon
  - Uncertainty list
  - Uncertainty-impact table
  - Critical uncertainty set
  - Uncertainty poles
  - Signpost list
  - Contingent action logic
  adjacent_methods:
  - pre-mortem
  - risk-matrix
  version: 0.3.0
  source: skills/critical-uncertainties/SKILL.md
- name: customer-segmentation
  title: Customer Segmentation
  category: customer-product-and-experience
  use_when: Use when treating all customers the same is obscuring priorities, offer design, or service
    strategy. Use when applying the Customer Segmentation consulting method and when a user asks for Customer
    Segmentation, method execution, structured diagnosis, or action planning.
  do_not_use_when: Do not use without a defined customer population and evidence of differences that change
    needs, economics, behavior, or treatment. Avoid segments based on convenient demographics that do
    not change a decision.
  required_inputs:
  - customer universe
  - needs or behaviors
  - value data
  - usage or buying evidence
  primary_outputs:
  - Segmentation purpose
  - Segmentation dimensions
  - Segment definitions
  - Segment profiles
  - Segment strategy
  adjacent_methods: []
  version: 0.3.0
  source: skills/customer-segmentation/SKILL.md
- name: customer-success-health-score
  title: Customer Success Health Score
  category: customer-product-and-experience
  use_when: Use when assessing retention risk, expansion potential, account quality, or service intervention
    priority. Use when applying the Customer Success Health Score consulting method and when a user asks
    for Customer Success Health Score, method execution, structured diagnosis, or action planning.
  do_not_use_when: Do not use before customer outcomes, adoption signals, relationship signals, renewal
    risk, and data quality are defined. One aggregate score must not hide a critical failure condition.
  required_inputs:
  - customer or account list
  - usage/adoption signals
  - value realization evidence
  - relationship and support data
  primary_outputs:
  - Health definition
  - Signal model
  - Health scoring rubric
  - Health score table
  - CS intervention plan
  adjacent_methods: []
  version: 0.3.0
  source: skills/customer-success-health-score/SKILL.md
- name: deal-strategy-map
  title: Deal Strategy Map
  category: strategy-market-and-commercial
  use_when: Use when pursuing a specific opportunity and needing a structured path to win or advance.
    Use when applying the Deal Strategy Map consulting method and when a user asks for Deal Strategy Map,
    method execution, structured diagnosis, or action planning.
  do_not_use_when: Do not use without a specific opportunity, decision process, competitive position,
    value case, and next milestone. For the broader relationship and whitespace, use an account plan.
  required_inputs:
  - opportunity details
  - buyer process
  - stakeholders
  - competitors
  - proof and objections
  primary_outputs:
  - Deal frame
  - Buying-process map
  - Win/loss driver map
  - Stakeholder pursuit plan
  - Deal action plan
  adjacent_methods: []
  version: 0.3.0
  source: skills/deal-strategy-map/SKILL.md
- name: decision-matrix
  title: Decision Matrix
  category: prioritization-and-economics
  use_when: Use when choosing among options and the decision needs explicit criteria, tradeoffs, and defensible
    reasoning. Use when applying the Decision Matrix consulting method and when a user asks for Decision
    Matrix, method execution, structured diagnosis, or action planning.
  do_not_use_when: Do not use when there is only one viable option, the decision criteria are not agreed,
    or mandatory requirements remain unresolved. Apply hard gates before weighted scoring.
  required_inputs:
  - options
  - decision criteria
  - weights
  - evidence for scoring
  primary_outputs:
  - Viable option set
  - Criteria list
  - Weighted criteria
  - Completed decision matrix
  - Decision recommendation
  adjacent_methods: []
  version: 0.3.0
  source: skills/decision-matrix/SKILL.md
- name: deductive-reasoning
  title: Deductive Reasoning
  category: reasoning-and-root-cause
  use_when: Use when a conclusion must be tested against explicit rules, principles, criteria, policies,
    definitions, premises, or if-then logic. Use when applying deductive reasoning, rule-based reasoning,
    premise-to-conclusion testing, logical consistency checks, or validity review.
  do_not_use_when: Do not use when there are no clear premises or rules and the task is pattern discovery.
    Use `inductive-reasoning`, `abductive-reasoning`, or `affinity-diagram` first.
  required_inputs:
  - conclusion or decision to test
  - stated rules, criteria, principles, policies, or premises
  - facts of the specific case
  - scope boundary
  - exceptions or override conditions
  primary_outputs:
  - Conclusion to test
  - Premise list
  - Premise quality table
  - Logic chain
  - Validity judgment
  - Exception list
  - Revised conclusion
  adjacent_methods:
  - abductive-reasoning
  - affinity-diagram
  - inductive-reasoning
  version: 0.3.0
  source: skills/deductive-reasoning/SKILL.md
- name: effort-impact-matrix
  title: Effort Impact Matrix
  category: prioritization-and-economics
  use_when: Use when there are multiple possible next actions and the user needs quick wins, major projects,
    fill-ins, or deprioritized items. Use when applying the Effort Impact Matrix consulting method and
    when a user asks for Effort Impact Matrix, method execution, structured diagnosis, or action planning.
  do_not_use_when: Do not use when impact and effort cannot be estimated on a comparable basis or when
    hard dependencies determine the sequence. This is a relative triage tool, not a full investment case.
  required_inputs:
  - candidate actions
  - impact estimate
  - effort estimate
  - time or resource constraints
  primary_outputs:
  - Normalized action list
  - Scoring scale
  - Scored action table
  - Effort-impact matrix
  - Sequenced action plan
  adjacent_methods: []
  version: 0.3.0
  source: skills/effort-impact-matrix/SKILL.md
- name: empathy-map
  title: Empathy Map
  category: customer-product-and-experience
  use_when: Use when stakeholder motivation is unclear and the work requires a grounded, human view before
    messaging or intervention design. Use when applying the Empathy Map consulting method and when a user
    asks for Empathy Map, method execution, structured diagnosis, or action planning.
  do_not_use_when: Do not use to invent what users think or feel, or to map organizational power. Base
    the map on a defined user and context, with observations or interviews separated from assumptions.
  required_inputs:
  - target person or segment
  - observed behavior
  - quotes or facts
  - uncertain assumptions
  primary_outputs:
  - Empathy-map scope
  - Evidence list
  - Empathy map
  - Need and concern diagnosis
  - Action implications
  adjacent_methods: []
  version: 0.3.0
  source: skills/empathy-map/SKILL.md
- name: evidence-map
  title: Evidence Map
  category: problem-framing-and-evidence
  use_when: Use when facts, claims, assumptions, missing evidence, and confidence levels need to be separated
    before diagnosis. Use when applying an evidence map, evidence ledger, fact-versus-assumption review,
    proof inventory, or evidence-strength assessment.
  do_not_use_when: Do not use when the facts are already clean and the main need is choosing among options.
    Use `decision-matrix`, `weighted-scorecard`, or `effort-impact-matrix` instead.
  required_inputs:
  - decision or diagnostic question
  - raw statements, observations, documents, or claims
  - source of each statement when available
  - current conclusion or proposed action
  - decision deadline or consequence if relevant
  primary_outputs:
  - Evidence question
  - Evidence inventory
  - Evidence type map
  - Evidence rating table
  - Evidence gap list
  - Validation actions
  adjacent_methods:
  - decision-matrix
  - effort-impact-matrix
  - weighted-scorecard
  version: 0.3.0
  source: skills/evidence-map/SKILL.md
- name: fifteen-percent-solutions
  title: Fifteen Percent Solutions
  category: execution-and-validation
  use_when: Use when the user needs immediate controllable next actions inside limited authority, resources,
    or certainty. Use when applying 15% Solutions, small controllable action, low-regret next step, agency
    boundary, or next-72-hour action planning.
  do_not_use_when: Do not use when a high-risk action requires formal approval, legal review, compliance
    clearance, or irreversible commitment. Use `risk-matrix`, `raci-matrix`, or `communications-plan`
    first.
  required_inputs:
  - desired outcome
  - user's role, authority, relationships, and constraints
  - blockers outside the user's control
  - available time, access, and resources
  - risk tolerance
  primary_outputs:
  - Near-term progress target
  - Control boundary map
  - Candidate 15% actions
  - Shortlisted actions
  - Immediate action plan
  - Validation signal
  adjacent_methods:
  - communications-plan
  - raci-matrix
  - risk-matrix
  version: 0.3.0
  source: skills/fifteen-percent-solutions/SKILL.md
- name: first-principles-thinking
  title: First Principles Thinking
  category: reasoning-and-root-cause
  use_when: Use when assumptions, analogies, legacy constraints, or accepted ways of working may be hiding
    a better solution. Use when applying First Principles Thinking, reasoning from fundamentals, assumption
    stripping, rebuilding from basic truths, or non-incremental problem solving.
  do_not_use_when: Do not use for a routine root-cause investigation, evidence classification, or option
    scoring. Use `five-whys-root-cause` for one cause chain, `fishbone-diagram` for multi-factor operational
    causes, and `evidence-map` when the fact base is not yet reliable. Use first principles when inherited
    assumptions or analogy constrain the option set.
  required_inputs:
  - problem statement
  - current assumptions
  - known constraints
  - evidence or facts
  - desired outcome
  primary_outputs:
  - Plain problem statement
  - Assumption inventory
  - First-principles breakdown
  - Rebuilt solution options
  - Validation plan and recommended option
  adjacent_methods:
  - evidence-map
  - fishbone-diagram
  - five-whys-root-cause
  version: 0.3.0
  source: skills/first-principles-thinking/SKILL.md
- name: fishbone-diagram
  title: Fishbone Diagram
  category: reasoning-and-root-cause
  use_when: Use when a problem may have multiple operational, human, process, system, or environmental
    causes. Use when applying the Fishbone Diagram consulting method and when a user asks for Fishbone
    Diagram, method execution, structured diagnosis, or action planning.
  do_not_use_when: Do not use for a single verified linear cause or treat category branches as proven
    causes. Fishbone analysis is for exploring multiple cause families that still require evidence.
  required_inputs:
  - problem statement
  - observed symptoms
  - process context
  - candidate cause categories
  primary_outputs:
  - Effect statement
  - Cause categories
  - Fishbone cause map
  - Evidence-coded fishbone
  - Root-cause test plan
  adjacent_methods: []
  version: 0.3.0
  source: skills/fishbone-diagram/SKILL.md
- name: five-whys-root-cause
  title: Five Whys Root Cause
  category: reasoning-and-root-cause
  use_when: Use when a problem keeps recurring, the first explanation is too shallow, or the action plan
    risks treating symptoms. Use when applying the Five Whys Root Cause consulting method and when a user
    asks for Five Whys Root Cause, method execution, structured diagnosis, or action planning.
  do_not_use_when: Do not use when the problem has several interacting causal paths, feedback loops, or
    insufficient event evidence. A single Why chain can oversimplify a multi-causal system.
  required_inputs:
  - problem statement
  - evidence
  - timeline
  - constraints and failed fixes
  primary_outputs:
  - Problem statement
  - Cause 1
  - Cause chain
  - Cause branches
  - Root-cause action plan
  adjacent_methods: []
  version: 0.3.0
  source: skills/five-whys-root-cause/SKILL.md
- name: force-field-analysis
  title: Force Field Analysis
  category: stakeholder-change-and-governance
  use_when: Use when adoption, stakeholder support, or organizational movement depends on shifting incentives
    and resistance. Use when applying the Force Field Analysis consulting method and when a user asks
    for Force Field Analysis, method execution, structured diagnosis, or action planning.
  do_not_use_when: 'Do not use when the target change and relevant actors are unclear. Avoid generic pros-and-cons
    lists: each driving or restraining force needs evidence, relative strength, and a practical response.'
  required_inputs:
  - desired change
  - supporting forces
  - resisting forces
  - stakeholders
  - constraints
  primary_outputs:
  - Change statement
  - Driving-force list
  - Restraining-force list
  - Force field map
  - Change lever plan
  adjacent_methods: []
  version: 0.3.0
  source: skills/force-field-analysis/SKILL.md
- name: go-to-market-diagnosis
  title: Go To Market Diagnosis
  category: strategy-market-and-commercial
  use_when: Use when a product, service, or consulting offer needs market entry, growth, or conversion
